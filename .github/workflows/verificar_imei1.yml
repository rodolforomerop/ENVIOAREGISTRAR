name: Verificador Automatico de IMEI (RIM)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rim-imei-check
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FIREBASE_CREDENTIALS_B64: ${{ secrets.FIREBASE_CREDENTIALS_B64 }}
      REGISTRATION_API_KEY: ${{ secrets.REGISTRATION_API_KEY }}
      HOST_URL: https://registroimeimultibanda.cl
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IMEI Check Script
        run: python main.py
