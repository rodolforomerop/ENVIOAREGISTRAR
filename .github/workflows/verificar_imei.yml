name: Verificador Automatico de IMEI (GSHEET)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"  # OJO: en UTC

permissions:
  contents: read

concurrency:
  group: gsheet-imei-check
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
      GSPREAD_SHEET_NAME: ${{ secrets.GSPREAD_SHEET_NAME }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IMEI Check Script
        run: python script.py
